name: V-CORP tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run offline game-logic suites
        run: python tests/run_all.py

      - name: Import check (all handlers)
        run: python -c "import vcorp.__main__; print('bootstrap imports OK')"
